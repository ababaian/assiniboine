# Settings for scripts/ops/run_example.sh: a synthetic run that finishes in
# seconds. The method sections are left at their defaults on purpose, so the
# example exercises the same rules as a real run.

[run]
name = "example"
work_dir = "work/example"

[source]
# run_example.sh writes a synthetic archive here; stage 0 links it.
url = "work/example/example_source.fa.zst"
filename = "example_source.fa.zst"
expected_bytes = 0

[compute]
records_per_part = 1000
part_workers = 2
records_per_chunk = 500
dotbracket_parts = 4
dotbracket_workers = 2
