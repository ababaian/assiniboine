[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assiniboine"
version = "1.0.0"
description = "Screen circular sequencing contigs for rod-like, ribozyme-bearing RNAs"
readme = "README.md"
requires-python = ">=3.11"
# The package itself uses only the standard library. The bioinformatics tools
# and the external classifier's Python stack come from environment.yml.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
assiniboine = "assiniboine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
